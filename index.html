```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>أسرة السمائيين</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <section class="hero">

            <div class="badge">
                ✨ أسرة السمائيين
            </div>

            <h1>
                أسرة السمائيين
            </h1>

            <p class="subtitle">
                حفلة نهاية الأنشطة لأسرة السمائيين
            </p>

        </section>


        <!-- =========================
             STAGE
        ========================== -->

        <div class="stage">
            🎭 المسرح
        </div>


        <!-- =========================
             SPECIAL AREA
             TWO ROWS WITHOUT NUMBERS
        ========================== -->

        <section class="special-area">

            <div class="special-title">
                🔒 خاص بالآباء الكهنة والخدام
            </div>

            <div class="special-row">
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>

                <div class="special-aisle"></div>

                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
            </div>

            <div class="special-row">
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>

                <div class="special-aisle"></div>

                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
                <div class="special-seat"></div>
            </div>

        </section>


        <!-- =========================
             NORMAL SEATS
        ========================== -->

        <h2 class="seats-title">
            اختر مقاعدك 🎟️
        </h2>

        <div
            id="seats"
            class="seats"
        ></div>


        <!-- =========================
             LEGEND
        ========================== -->

        <div class="legend">

            <span>
                <i class="available"></i>
                متاح
            </span>

            <span>
                <i class="selected-color"></i>
                تم اختياره
            </span>

            <span>
                <i class="reserved-color"></i>
                محجوز
            </span>

        </div>


        <!-- =========================
             BOOKING BOX
        ========================== -->

        <section class="booking-box">

            <h2>
                🎟️ بيانات الحجز
            </h2>

            <p id="selectedSeat">
                لم يتم اختيار أي مقعد
            </p>

            <p
                id="phoneLimitMessage"
                class="phone-limit-message"
            >
                الحد الأقصى للحجز: كرسيان لكل رقم هاتف
            </p>

            <input
                id="name"
                type="text"
                placeholder="اكتب الاسم"
                autocomplete="name"
            >

            <input
                id="phone"
                type="tel"
                placeholder="رقم الهاتف"
                autocomplete="tel"
            >

            <button id="bookButton">
                تأكيد الحجز
            </button>

        </section>


        <!-- =========================
             INVITATION
        ========================== -->

        <section
            id="invitationSection"
            class="invitation-section"
        >

            <h2>
                🎉 دعوتك جاهزة!
            </h2>

            <p>
                احفظ الدعوة على موبايلك
            </p>

            <canvas
                id="invitationCanvas"
                width="1080"
                height="1920"
            ></canvas>

            <button id="downloadInvitation">
                📥 تحميل الدعوة
            </button>

        </section>

    </div>


    <script src="script.js?v=13"></script>

</body>

</html>
```
