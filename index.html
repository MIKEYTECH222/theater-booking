<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حجز مقاعد حفل ختام الأنشطة</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <section class="hero">

            <div class="badge">
                ✨ أسرة أبطال الإيمان وأسرة شهيدات
            </div>

            <h1>
                حفل ختام الأنشطة
            </h1>

            <p class="subtitle">
                اختر مقاعدك واحجز مكانك
            </p>

        </section>


        <!-- =========================
             STAGE
        ========================== -->

        <div class="stage">
            🎭 المسرح
        </div>


        <!-- =========================
             SEATS
        ========================== -->

        <h2 class="seats-title">
            اختر مقاعدك 🎟️
        </h2>

        <p class="seats-info">
            يمكنك حجز مقعدين كحد أقصى
        </p>

        <div id="seats" class="seats"></div>


        <!-- =========================
             LEGEND
        ========================== -->

        <div class="legend">

            <span>
                <i class="available"></i>
                متاح
            </span>

            <span>
                <i class="selected-color"></i>
                تم اختياره
            </span>

            <span>
                <i class="reserved"></i>
                محجوز
            </span>

        </div>


        <!-- =========================
             BOOKING
        ========================== -->

        <section class="booking-box">

            <h2>
                بيانات الحجز
            </h2>

            <p id="selectedSeat">
                لم يتم اختيار أي مقعد
            </p>

            <input
                id="name"
                type="text"
                placeholder="اكتب الاسم"
                autocomplete="name"
            >

            <input
                id="phone"
                type="tel"
                placeholder="رقم الهاتف"
                autocomplete="tel"
            >

            <button
                id="bookButton"
                type="button"
            >
                تأكيد الحجز
            </button>

            <p
                id="bookingMessage"
                class="booking-message"
            ></p>

        </section>


        <!-- =========================
             INVITATION
        ========================== -->

        <section
            id="invitationSection"
            class="invitation-section"
        >

            <div class="invitation-header">

                <div class="invitation-icon">
                    🎉
                </div>

                <h2>
                    دعوتك جاهزة!
                </h2>

                <p>
                    احفظ الدعوة على موبايلك
                </p>

            </div>

            <div class="canvas-wrapper">

                <canvas
                    id="invitationCanvas"
                    width="1080"
                    height="1920"
                ></canvas>

            </div>

            <button
                id="downloadInvitation"
                type="button"
            >
                📥 تحميل الدعوة
            </button>

        </section>

    </main>


    <!-- =========================
         SCRIPT
    ========================== -->

    <script src="script.js?v=40"></script>

</body>

</html>
