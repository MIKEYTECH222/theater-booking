<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أسرة السمائيين</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- العنوان -->
        <section class="hero">

            <div class="badge">
                ✨ أسرة السمائيين
            </div>

            <h1>
                أسرة السمائيين
            </h1>

            <p class="subtitle">
                حفلة نهاية الأنشطة لأسرة السمائيين
            </p>

        </section>


        <!-- المسرح -->
        <div class="stage">
            🎭 المسرح
        </div>


        <!-- عنوان المقاعد -->
        <h2 class="seats-title">
            اختر مقاعدك 🎟️
        </h2>


        <!-- هنا JavaScript هيعمل الـ99 كرسي -->
        <div id="seats" class="seats"></div>


        <!-- دليل الألوان -->
        <div class="legend">

            <span>
                <i class="available"></i>
                متاح
            </span>

            <span>
                <i class="selected-color"></i>
                تم اختياره
            </span>

            <span>
                <i class="reserved-color"></i>
                محجوز
            </span>

        </div>


        <!-- بيانات الحجز -->
        <section class="booking-box">

            <h2>
                🎟️ بيانات الحجز
            </h2>

            <p id="selectedSeat">
                لم يتم اختيار أي مقعد
            </p>

            <input
                id="name"
                type="text"
                placeholder="اكتب الاسم"
                autocomplete="name"
            >

            <input
                id="phone"
                type="tel"
                placeholder="رقم الهاتف"
                autocomplete="tel"
            >

            <button id="bookButton">
                تأكيد الحجز
            </button>

        </section>


        <!-- الدعوة -->
        <section
            id="invitationSection"
            class="invitation-section"
        >

            <h2>
                🎉 دعوتك جاهزة!
            </h2>

            <p>
                احفظ الدعوة على موبايلك
            </p>

            <canvas
                id="invitationCanvas"
                width="1080"
                height="1920"
            ></canvas>

            <button id="downloadInvitation">
                📥 تحميل الدعوة
            </button>

        </section>

    </div>


    <!-- JavaScript -->
    <script src="script.js?v=12"></script>

</body>

</html>
