```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حجز مسرح - أسرة أبطال الإيمان وأسرة شهيدات</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <section class="hero">

        <div class="badge">
            ✨ أسرة أبطال الإيمان وأسرة شهيدات
        </div>

        <h1>
            حفل ختام الأنشطة
        </h1>

        <p class="subtitle">
            اختر مقاعدك واحجز مكانك
        </p>

    </section>


    <div class="stage">
        🎭 المسرح
    </div>


    <h2 class="seats-title">
        اختر مقاعدك 🎟️
    </h2>


    <!-- الكراسي -->
    <div id="seats" class="seats"></div>


    <div class="legend">

        <span>
            <i class="available"></i>
            متاح
        </span>

        <span>
            <i class="selected-color"></i>
            تم اختياره
        </span>

        <span>
            <i class="reserved"></i>
            محجوز
        </span>

        <span>
            <i class="locked-color"></i>
            خاص بالآباء الكهنة
        </span>

    </div>


    <section class="booking-box">

        <h2>
            بيانات الحجز
        </h2>

        <p id="selectedSeat">
            لم يتم اختيار أي مقعد
        </p>

        <input
            id="name"
            type="text"
            placeholder="اكتب الاسم"
            autocomplete="name"
        >

        <input
            id="phone"
            type="tel"
            placeholder="رقم الهاتف"
            autocomplete="tel"
        >

        <button id="bookButton">
            تأكيد الحجز
        </button>

        <div
            id="bookingMessage"
            class="booking-message"
        ></div>

    </section>


    <section
        id="invitationSection"
        class="invitation-section"
    >

        <div class="invitation-header">

            <div class="invitation-icon">
                🎉
            </div>

            <h2>
                دعوتك جاهزة!
            </h2>

            <p>
                احفظ الدعوة على موبايلك
            </p>

        </div>


        <div class="canvas-wrapper">

            <canvas
                id="invitationCanvas"
                width="1080"
                height="1920"
            ></canvas>

        </div>


        <button id="downloadInvitation">
            📥 تحميل الدعوة
        </button>

    </section>

</div>


<script src="script.js?v=10"></script>

</body>
</html>
```
