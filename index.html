```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أسرة السمائيين</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="hero">

            <div class="badge">
                ✨ أسرة السمائيين
            </div>

            <h1>
                أسرة السمائيين
            </h1>

            <p class="subtitle">
                حفلة نهاية الأنشطة لأسرة السمائيين
            </p>

        </div>


        <!-- Stage -->
        <div class="stage">
            🎭 المسرح
        </div>


        <!-- Seats title -->
        <div class="seats-title">
            اختر مقاعدك
        </div>


        <!-- Seats -->
        <div
            class="seats"
            id="seats">
        </div>


        <!-- Legend -->
        <div class="legend">

            <span>
                <i class="available"></i>
                متاح
            </span>

            <span>
                <i class="selected"></i>
                تم اختياره
            </span>

            <span>
                <i class="reserved"></i>
                محجوز
            </span>

            <span>
                <i class="locked-color"></i>
                خاص بالآباء الكهنة
            </span>

        </div>


        <!-- Booking box -->
        <div class="booking-box">

            <h2>
                🎟️ بيانات الحجز
            </h2>

            <p id="selectedSeat">
                لم يتم اختيار أي مقعد
            </p>

            <input
                type="text"
                id="name"
                placeholder="اكتب الاسم"
                autocomplete="name"
            >

            <input
                type="tel"
                id="phone"
                placeholder="رقم الهاتف"
                autocomplete="tel"
            >

            <button id="bookButton">
                تأكيد الحجز
            </button>

        </div>


        <!-- Invitation -->
        <div
            class="invitation-section"
            id="invitationSection">

            <h2>
                🎉 دعوتك جاهزة!
            </h2>

            <p>
                احفظها على موبايلك واحتفظ بها للحفلة
            </p>

            <canvas
                id="invitationCanvas"
                width="1080"
                height="1920">
            </canvas>

            <button id="downloadInvitation">
                📥 تحميل الدعوة
            </button>

        </div>

    </div>


    <script src="script.js?v=7"></script>

</body>

</html>
```
