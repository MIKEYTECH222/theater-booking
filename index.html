<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حجز مقاعد المسرح</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>اسره السمائين</h1>

        <p class="subtitle">
            حفلة نهاية الأنشطة
        </p>

        <!-- المسرح -->
        <div class="stage">
            المسرح
        </div>

        <!-- المقاعد -->
        <div class="seats" id="seats"></div>

        <!-- دليل الألوان -->
        <div class="legend">

            <span>
                <i class="available"></i>
                متاح
            </span>

            <span>
                <i class="selected"></i>
                تم اختياره
            </span>

            <span>
                <i class="reserved"></i>
                محجوز
            </span>

        </div>

        <!-- الحجز -->
        <div class="booking-box">

            <h2>اختيار المقاعد</h2>

            <p id="selectedSeat">
                لم يتم اختيار أي مقعد
            </p>

            <input
                type="text"
                id="name"
                placeholder="اكتب اسمك"
            >

            <input
                type="tel"
                id="phone"
                placeholder="رقم الهاتف"
            >

            <button id="bookButton">
                تأكيد الحجز
            </button>

        </div>

    </div>

    <script src="script.js?v=4"></script>

</body>

</html>
