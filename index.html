<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أسرة السمائيين</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="hero">
            <div class="badge">✨ أسرة السمائيين</div>

            <h1>أسرة السمائيين</h1>

            <p class="subtitle">
                حفلة نهاية الأنشطة
            </p>
        </div>

        <!-- المسرح -->
        <div class="stage">
            🎭 المسرح
        </div>

        <!-- المقاعد -->
        <div class="seats" id="seats"></div>

        <!-- دليل الألوان -->
        <div class="legend">

            <span>
                <i class="available"></i>
                متاح
            </span>

            <span>
                <i class="selected"></i>
                تم اختياره
            </span>

            <span>
                <i class="reserved"></i>
                محجوز
            </span>

        </div>

        <!-- صندوق الحجز -->
        <div class="booking-box">

            <h2>اختار مقاعدك 🎟️</h2>

            <p id="selectedSeat">
                لم يتم اختيار أي مقعد
            </p>

            <input
                type="text"
                id="name"
                placeholder="اكتب اسمك"
            >

            <input
                type="tel"
                id="phone"
                placeholder="رقم الهاتف"
            >

            <button id="bookButton">
                تأكيد الحجز
            </button>

        </div>

        <!-- الدعوة -->
        <div class="invitation-section" id="invitationSection">

            <h2>🎉 دعوتك جاهزة!</h2>

            <p>
                تقدر تحمل الدعوة على موبايلك
            </p>

            <canvas
                id="invitationCanvas"
                width="1080"
                height="1920">
            </canvas>

            <button id="downloadInvitation">
                📥 تحميل الدعوة
            </button>

        </div>

    </div>

    <script src="script.js?v=5"></script>

</body>

</html>
